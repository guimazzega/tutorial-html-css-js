<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF Investments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div id="logo">
               <img src="../img/money-svgrepo-com.svg"alt="Logo Investments">
                <h1>IF <span>Investments</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a href= "index.html">Home</a></li>
                    <li><a href= "bolsas.html">Bolsas</a></li>
                    <li><a href= "cadastro.html" class="active">Cadastro</a></li>
                </ul>
            </nav> 
        </div>
    </header>
    <main>
        <div class="wrapper">
            <h1>Cadastro</h1>
            <form>
                <fieldset>
                    <legend>Informações Pessoais</legend>
                <label for="nameUser">Nome:</label>
                <input type="text" name="nameUser" id="nameUser" placeholder="Nome ">

                <label for="surnameUser">Sobrenome:</label>
                <input type="text" name="surnameUser" id="surnameUser" placeholder="Sobrenome">

                <label for="passwordUser">Senha:</label>
                <input type="password" name="passwordUser" id="passwordUser" placeholder="Senha">
            </fieldset>
                <h3>Qual seu perfil de investidor?</h3>

                <div> 
                    <input type="radio" name="perfilInvestidor" id="conservador" value="conservador">
                    <label for="conservador">Conservador</label>
                </div>
                <div>
                    <input type="radio" name="perfilInvestidor" id="moderado" value="moderado">
                    <label for="moderado">Moderado</label>
                </div>
                <div>
                    <input type="radio" name="perfilInvestidor" id="arrojado" value="arrojado">
                    <label for="arrojado">Arrojado</label>
                </div>

                <h3>Quais tipos de investimentos você tem interesse?</h3>

                <div>
                    <input type="checkbox" name="tipoInvestimento" id="rendaFixa" value="rf">
                    <label for="rendaFixa">Renda Fixa</label>
                </div>
                <div>
                    <input type="checkbox" name="tipoInvestimento" id="rendaVariavel" value="rv">
                    <label for="rendaVariavel">Renda Variável</label>
                </div>
                <div>
                    <input type="checkbox" name="tipoInvestimento" id="fundosImobiliarios" value="fi">
                    <label for="fundosImobiliarios">Fundos Imobiliários</label>
                </div>
                <div>
                    <input type="checkbox" name="tipoInvestimento" id="criptoativos" value="ca">
                    <label for="criptoativos">Criptoativos</label>
                </div>

                <fieldset>
                    <legend>Endereço</legend>
                    <label for="streetUser">Rua:</label>
                    <input type="text" name="streetlUser" id="streetlUser" placeholder="Rua e Número">

                   <label for="stateUser">Estado:</label>
                    <select name="stateUser" id="stateUser">
                        <option value="sp">São Paulo</option>
                        <option value="rj">Rio de Janeiro</option>
                        <option value="mg">Minas Gerais</option>
                        <option value="es">Espírito Santo</option>
                    </select>
                </fieldset>

                <label for="investimentgoalUser">Objetivo de Investimento</label>
                <textarea name="investimentgoalUser" id="investimentgoalUser" rows="5" placeholder="Descreva seu objetivo de investimento..."></textarea>

                <input type="submit" value="Cadastrar">

                
            </form>
        </div>
         
    </main>
    <footer>
        <div class="wrapper"></div>
    </footer>
    
</body>
</html>
